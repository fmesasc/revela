<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revela</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233f6497'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
  <link rel="stylesheet" href="src/ui/styles.css">
  <script type="module"
    src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
</head>
<body>
  <header id="ribbon">
    <div class="titlebar">
      <span class="brand">Revela</span>
      <div class="qat" title="Acceso rápido">
        <button data-action="save" class="mini" title="Guardar proyecto"><i class="ms">save</i></button>
        <button data-action="undo" class="mini" title="Deshacer (Ctrl+Z)"><i class="ms">undo</i></button>
        <button data-action="redo" class="mini" title="Rehacer (Ctrl+Y)"><i class="ms">redo</i></button>
      </div>
      <span class="grow"></span>
      <span class="doc-name" contenteditable="true" spellcheck="false"
        title="Haz clic para renombrar la presentación"></span>
      <span class="grow"></span>
    </div>

    <nav class="tabs">
      <button data-tab="file">Archivo</button>
      <button data-tab="home" class="active">Inicio</button>
      <button data-tab="insert">Insertar</button>
      <button data-tab="design">Diseño</button>
      <button data-tab="transitions">Transiciones</button>
      <button data-tab="animations">Animaciones</button>
      <button data-tab="view">Ver</button>
    </nav>

    <div class="pages">
      <!-- ARCHIVO -->
      <section class="ribbon-page" data-page="file">
        <div class="group">
          <div class="row">
            <button data-action="new"><i class="ms">note_add</i><span>Nuevo</span></button>
            <button data-action="open"><i class="ms">folder_open</i><span>Abrir</span></button>
            <button data-action="save"><i class="ms">save</i><span>Guardar</span></button>
          </div><label>Proyecto</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-action="import-pptx" class="lg"><i class="ms">upload_file</i><span>Importar<br>PowerPoint</span></button>
          </div><label>Importar</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-action="export" class="lg"><i class="ms">download</i><span>Exportar<br>HTML</span></button>
            <button data-action="export-pdf" class="lg"><i class="ms">picture_as_pdf</i><span>Exportar<br>PDF</span></button>
            <button data-action="present" class="lg go"><i class="ms">play_arrow</i><span>Presentar</span></button>
          </div><label>Salida</label>
        </div>
      </section>

      <!-- INICIO -->
      <section class="ribbon-page active" data-page="home">
        <div class="group">
          <div class="row">
            <button data-action="slide-add"><i class="ms">add_to_photos</i><span>Nueva</span></button>
            <button data-action="slide-duplicate"><i class="ms">content_copy</i><span>Duplicar</span></button>
            <button data-action="slide-delete"><i class="ms">delete</i><span>Eliminar</span></button>
            <button data-action="section-add"><i class="ms">segment</i><span>Sección</span></button>
          </div><label>Diapositivas</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-action="insert-text"><i class="ms">title</i><span>Texto</span></button>
            <button data-action="insert-image"><i class="ms">image</i><span>Imagen</span></button>
            <button data-action="insert-model"><i class="ms">view_in_ar</i><span>3D</span></button>
          </div><label>Insertar</label>
        </div>
        <div class="group">
          <div class="row">
            <select data-font title="Tipo de letra" class="font-select"></select>
            <input data-size type="text" inputmode="numeric" title="Tamaño de letra (personalizable)"
              class="size-input" list="size-list" value="40">
            <datalist id="size-list">
              <option>8</option><option>10</option><option>12</option><option>14</option><option>16</option>
              <option>18</option><option>20</option><option>24</option><option>28</option><option>32</option>
              <option>40</option><option>44</option><option>54</option><option>60</option><option>72</option>
              <option>96</option><option>120</option><option>144</option>
            </datalist>
            <button data-fontdelta="4" title="Aumentar tamaño"><i class="ms">text_increase</i></button>
            <button data-fontdelta="-4" title="Reducir tamaño"><i class="ms">text_decrease</i></button>
          </div><label>Tipo de letra</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-fmt="bold" title="Negrita"><i class="ms">format_bold</i></button>
            <button data-fmt="italic" title="Cursiva"><i class="ms">format_italic</i></button>
            <button data-fmt="underline" title="Subrayado"><i class="ms">format_underlined</i></button>
            <button data-fmt="strikeThrough" title="Tachado"><i class="ms">format_strikethrough</i></button>
            <button data-fmt="superscript" title="Superíndice"><i class="ms">superscript</i></button>
            <button data-fmt="subscript" title="Subíndice"><i class="ms">subscript</i></button>
            <label class="color"><i class="ms">format_color_text</i><input type="color" data-color value="#ffffff" title="Color del texto"></label>
            <label class="color"><i class="ms">format_ink_highlighter</i><input type="color" data-highlight value="#ffe600" title="Resaltado"></label>
            <button data-fmt="removeFormat" title="Quitar formato"><i class="ms">format_clear</i></button>
          </div><label>Fuente</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-para="left" title="Alinear texto a la izquierda"><i class="ms">format_align_left</i></button>
            <button data-para="center" title="Centrar texto"><i class="ms">format_align_center</i></button>
            <button data-para="right" title="Alinear texto a la derecha"><i class="ms">format_align_right</i></button>
            <button data-para="justify" title="Justificar"><i class="ms">format_align_justify</i></button>
            <button data-list="insertUnorderedList" title="Viñetas"><i class="ms">format_list_bulleted</i></button>
            <button data-list="insertOrderedList" title="Lista numerada"><i class="ms">format_list_numbered</i></button>
            <button data-dir title="Dirección del texto (derecha a izquierda)"><i class="ms">format_textdirection_r_to_l</i></button>
            <input data-linespacing type="text" inputmode="decimal" title="Interlineado (personalizable)"
              class="size-input" list="ls-list" value="1">
            <datalist id="ls-list">
              <option>1</option><option>1.15</option><option>1.25</option><option>1.5</option>
              <option>1.75</option><option>2</option><option>2.5</option><option>3</option>
            </datalist>
            <button class="group-more" data-more="paragraph" title="Más opciones de párrafo"><i class="ms">expand_more</i></button>
          </div><label>Párrafo</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-action="insert-link" title="Insertar enlace"><i class="ms">link</i></button>
            <button data-case="upper" title="MAYÚSCULAS"><b>AA</b></button>
            <button data-case="lower" title="minúsculas"><b>aa</b></button>
            <button data-case="title" title="Tipo Título"><b>Aa</b></button>
            <button data-symbols title="Símbolos y emojis"><i class="ms">emoji_emotions</i></button>
            <button data-action="find-replace" title="Buscar y reemplazar (Ctrl+F)"><i class="ms">search</i></button>
          </div><label>Texto</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-align="left" title="Alinear a la izquierda de la diapositiva"><i class="ms">align_horizontal_left</i></button>
            <button data-align="hcenter" title="Centrar horizontalmente"><i class="ms">align_horizontal_center</i></button>
            <button data-align="right" title="Alinear a la derecha"><i class="ms">align_horizontal_right</i></button>
            <button data-align="top" title="Alinear arriba"><i class="ms">align_vertical_top</i></button>
            <button data-align="vcenter" title="Centrar verticalmente"><i class="ms">align_vertical_center</i></button>
            <button data-align="bottom" title="Alinear abajo"><i class="ms">align_vertical_bottom</i></button>
            <button data-distribute="h" title="Distribuir horizontalmente (3+)"><i class="ms">horizontal_distribute</i></button>
            <button data-distribute="v" title="Distribuir verticalmente (3+)"><i class="ms">vertical_distribute</i></button>
          </div><label>Alinear / distribuir</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-action="front" title="Traer al frente"><i class="ms">flip_to_front</i></button>
            <button data-action="back" title="Enviar al fondo"><i class="ms">flip_to_back</i></button>
            <button data-action="forward" title="Adelantar"><i class="ms">keyboard_arrow_up</i></button>
            <button data-action="backward" title="Atrasar"><i class="ms">keyboard_arrow_down</i></button>
            <button data-action="group" title="Agrupar (Ctrl+G)"><i class="ms">join_inner</i></button>
            <button data-action="ungroup" title="Desagrupar (Ctrl+Mayús+G)"><i class="ms">join_full</i></button>
          </div><label>Organizar</label>
        </div>
      </section>

      <!-- INSERTAR -->
      <section class="ribbon-page" data-page="insert">
        <div class="group">
          <div class="row">
            <button data-action="insert-text" class="lg"><i class="ms">title</i><span>Cuadro<br>de texto</span></button>
            <button data-action="insert-image" class="lg"><i class="ms">image</i><span>Imagen</span></button>
            <button data-action="insert-table" class="lg"><i class="ms">table</i><span>Tabla</span></button>
          </div><label>Básico</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-action="insert-model" class="lg go"><i class="ms">view_in_ar</i><span>Modelo 3D<br>(.glb)</span></button>
            <button data-action="insert-video" class="lg"><i class="ms">movie</i><span>Vídeo</span></button>
            <button data-action="insert-audio" class="lg"><i class="ms">music_note</i><span>Audio</span></button>
            <button data-action="insert-embed" class="lg"><i class="ms">public</i><span>Página<br>web</span></button>
            <button data-action="insert-code" class="lg"><i class="ms">code</i><span>Código</span></button>
          </div><label>Multimedia</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-shape="rect" title="Rectángulo"><i class="ms">rectangle</i></button>
            <button data-shape="rounded" title="Rectángulo redondeado"><i class="ms">crop_square</i></button>
            <button data-shape="ellipse" title="Elipse"><i class="ms">circle</i></button>
            <button data-shape="triangle" title="Triángulo"><i class="ms">change_history</i></button>
            <button data-shape="diamond" title="Rombo"><i class="ms">diamond</i></button>
            <button data-shape="pentagon" title="Pentágono"><i class="ms">pentagon</i></button>
            <button data-shape="star" title="Estrella"><i class="ms">star</i></button>
            <button data-shape="rightarrow" title="Flecha de bloque"><i class="ms">double_arrow</i></button>
            <button data-shape="line" title="Línea"><i class="ms">horizontal_rule</i></button>
            <button data-shape="arrow" title="Flecha"><i class="ms">arrow_right_alt</i></button>
            <label class="color"><i class="ms">format_color_fill</i><input type="color" data-shape-fill value="#3f6497" title="Relleno de la forma"></label>
            <label class="color"><i class="ms">border_color</i><input type="color" data-shape-stroke value="#1e2a3a" title="Borde de la forma"></label>
          </div><label>Formas</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-template="title"><i class="ms">web</i><span>Portada</span></button>
            <button data-template="titleContent"><i class="ms">article</i><span>Título y<br>contenido</span></button>
            <button data-template="twoContent"><i class="ms">vertical_split</i><span>Dos<br>contenidos</span></button>
            <button data-template="comparison"><i class="ms">compare</i><span>Comparación</span></button>
            <button data-template="sectionHeader"><i class="ms">title</i><span>Encabezado<br>sección</span></button>
            <button data-template="showcase3D"><i class="ms">deployed_code</i><span>Escaparate<br>3D</span></button>
            <button data-template="blank"><i class="ms">crop_portrait</i><span>En blanco</span></button>
            <button data-action="template-save"><i class="ms">bookmark_add</i><span>Guardar<br>plantilla</span></button>
          </div><label>Plantillas</label>
        </div>
      </section>

      <!-- DISEÑO -->
      <section class="ribbon-page" data-page="design">
        <div class="group">
          <div class="row">
            <label class="color"><i class="ms">format_color_fill</i><span>Color</span><input type="color" data-bg value="#101317"></label>
            <label class="color"><input type="color" data-grad1 value="#3f6497"></label>
            <label class="color"><input type="color" data-grad2 value="#101317"></label>
            <button data-action="bg-gradient" title="Aplicar degradado"><i class="ms">gradient</i></button>
            <button data-action="bg-image" title="Imagen de fondo"><i class="ms">wallpaper</i></button>
          </div><label>Fondo</label>
        </div>
        <div class="group">
          <div class="row">
            <select data-theme title="Tema">
              <option value="black">Oscuro</option><option value="white">Claro</option>
              <option value="league">League</option><option value="night">Night</option>
              <option value="serif">Serif</option><option value="solarized">Solarized</option>
              <option value="moon">Moon</option><option value="dracula">Dracula</option>
            </select>
          </div><label>Tema</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-ratio="1280x720"><i class="ms">crop_16_9</i><span>16:9</span></button>
            <button data-ratio="960x720"><i class="ms">crop_5_4</i><span>4:3</span></button>
          </div><label>Tamaño</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-action="toggle-slidenum" title="Mostrar u ocultar los números"><i class="ms">tag</i><span>Números</span></button>
            <select data-slidenum-pos title="Posición del número">
              <option value="br">Abajo dcha.</option>
              <option value="bl">Abajo izq.</option>
              <option value="tr">Arriba dcha.</option>
              <option value="tl">Arriba izq.</option>
            </select>
            <select data-slidenum-fmt title="Formato del número">
              <option value="c">1</option>
              <option value="c/t">1 / N</option>
            </select>
          </div><label>Numeración</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-action="toggle-footer" title="Mostrar pie de página"><i class="ms">web_asset</i><span>Pie</span></button>
            <input data-footer-text type="text" placeholder="Texto del pie" class="size-input" style="width:130px">
            <button data-action="toggle-footerdate" title="Incluir la fecha"><i class="ms">event</i><span>Fecha</span></button>
          </div><label>Pie de página</label>
        </div>
      </section>

      <!-- TRANSICIONES -->
      <section class="ribbon-page" data-page="transitions">
        <div class="group wide">
          <div class="row">
            <button data-slide-transition="inherit" title="Usar la de la presentación"><i class="ms">settings_backup_restore</i><span>Heredar</span></button>
            <button data-slide-transition="none"><i class="ms">block</i><span>Ninguna</span></button>
            <button data-slide-transition="fade"><i class="ms">gradient</i><span>Fundido</span></button>
            <button data-slide-transition="slide"><i class="ms">swipe_left</i><span>Deslizar</span></button>
            <button data-slide-transition="convex"><i class="ms">chevron_right</i><span>Convex</span></button>
            <button data-slide-transition="concave"><i class="ms">chevron_left</i><span>Concave</span></button>
            <button data-slide-transition="zoom"><i class="ms">zoom_in</i><span>Zoom</span></button>
          </div><label>Transición de esta diapositiva</label>
        </div>
        <div class="group">
          <div class="row">
            <select data-deck-transition title="Transición por defecto">
              <option value="none">Ninguna</option><option value="fade">Fundido</option>
              <option value="slide">Deslizar</option><option value="convex">Convex</option>
              <option value="concave">Concave</option><option value="zoom">Zoom</option>
            </select>
            <select data-speed title="Velocidad">
              <option value="default">Normal</option><option value="fast">Rápida</option><option value="slow">Lenta</option>
            </select>
            <button data-action="toggle-loop" title="Repetir en bucle (kiosco)"><i class="ms">repeat</i></button>
          </div><label>Por defecto</label>
        </div>
        <div class="group">
          <div class="row">
            <input data-autoslide type="number" min="0" step="1" class="size-input" style="width:64px"
              title="Segundos hasta avanzar (0 = manual)" value="0">
          </div><label>Avance automático (s)</label>
        </div>
      </section>

      <!-- ANIMACIONES -->
      <section class="ribbon-page" data-page="animations">
        <div class="group wide">
          <div class="row">
            <button data-animation="fade-in"><i class="ms">gradient</i><span>Aparecer</span></button>
            <button data-animation="fade-up"><i class="ms">arrow_upward</i><span>Subir</span></button>
            <button data-animation="fade-down"><i class="ms">arrow_downward</i><span>Bajar</span></button>
            <button data-animation="fade-left"><i class="ms">arrow_back</i><span>Izquierda</span></button>
            <button data-animation="fade-right"><i class="ms">arrow_forward</i><span>Derecha</span></button>
            <button data-animation="zoom-in"><i class="ms">zoom_in</i><span>Zoom</span></button>
          </div><label>Entrada del objeto seleccionado</label>
        </div>
        <div class="group wide">
          <div class="row">
            <button data-animation="grow"><i class="ms">zoom_out_map</i><span>Agrandar</span></button>
            <button data-animation="shrink"><i class="ms">close_fullscreen</i><span>Encoger</span></button>
            <button data-animation="strike"><i class="ms">strikethrough_s</i><span>Tachar</span></button>
            <button data-animation="fade-out"><i class="ms">visibility_off</i><span>Desaparecer</span></button>
            <button data-animation="highlight-red"><i class="ms">ink_highlighter</i><span>Resaltar</span></button>
          </div><label>Énfasis y salida</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-action="obj-anim-clear"><i class="ms">animation</i><span>Sin<br>animación</span></button>
          </div><label>Quitar</label>
        </div>
      </section>

      <!-- VER -->
      <section class="ribbon-page" data-page="view">
        <div class="group">
          <div class="row">
            <button data-action="present" class="lg go"><i class="ms">play_arrow</i><span>Presentar</span></button>
            <button data-action="connect-mobile" class="lg"><i class="ms">smartphone</i><span>Conectar<br>móvil</span></button>
          </div><label>Presentación</label>
        </div>
        <div class="group">
          <div class="row">
            <button data-action="toggle-guides"><i class="ms">grid_on</i><span>Guías</span></button>
            <button data-action="toggle-ruler"><i class="ms">straighten</i><span>Regla</span></button>
            <button data-action="toggle-notes"><i class="ms">sticky_note_2</i><span>Notas</span></button>
          </div><label>Ayudas</label>
        </div>
      </section>
    </div>
  </header>

  <main>
    <aside id="navigator"></aside>
    <section id="canvas-wrap">
      <div id="stage-grid">
        <div id="ruler-corner"></div>
        <div id="ruler-h"></div>
        <div id="ruler-v"></div>
        <div id="stage"></div>
      </div>
    </section>
  </main>

  <section id="notes-bar" hidden>
    <label for="notes"><i class="ms">sticky_note_2</i> Notas del orador</label>
    <textarea id="notes" placeholder="Escribe aquí las notas para esta diapositiva…"></textarea>
  </section>

  <footer id="statusbar">
    <span class="hint">Clic para seleccionar · doble clic para editar · arrastra para mover · clic derecho para más opciones</span>
    <span class="grow"></span>
    <span id="status-slide"></span>
    <span class="zoom">
      <button data-action="zoom-out" title="Alejar"><i class="ms">remove</i></button>
      <button data-action="zoom-reset" id="zoom-label" title="Restablecer al 100%">100%</button>
      <button data-action="zoom-in" title="Acercar"><i class="ms">add</i></button>
      <button data-action="zoom-fit" title="Ajustar a la ventana"><i class="ms">fit_screen</i></button>
    </span>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
