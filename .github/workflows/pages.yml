# Publishes the open edition (the app, without the revelaslides.com website) on GitHub Pages when production
# changes (the branch produccion: promote.yml), after all the tests pass (tests.yml). No bundler: tools/build-site.mjs --open copies the app as it is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [produccion]          # (what's in production: promote.yml)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (Only the app and its legal pages: the website is revelaslides.com's, and the
      # repository's tests, tools and server code are not for publishing.)
      - run: node tools/build-site.mjs _site --open
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
