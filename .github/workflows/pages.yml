# Publica la edición abierta (la aplicación, sin la web de revelaslides.com) en GitHub Pages en cada push a main.
# No hay build: Revela es HTML/CSS/JS puro, así que se sube tal cual.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (Only the app and its legal pages: the website is revelaslides.com's, and the
      # repository's tests, tools and server code are not for publishing.)
      - run: node tools/build-site.mjs _site --open
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
