# Despliega el servidor de Revela (server/cloudflare: compartir y salas de
# colaboración) en Cloudflare cuando cambia, después de pasar sus pruebas.
#
# Secretos del repositorio (Settings ▸ Secrets and variables ▸ Actions):
#   CLOUDFLARE_API_TOKEN   token con la plantilla «Edit Cloudflare Workers»
#   CLOUDFLARE_ACCOUNT_ID  el ID de la cuenta de Cloudflare
# Sin ellos, solo pasa las pruebas. Los secretos del propio Worker
# (UPLOAD_KEY, ALLOWED) se quedan en Cloudflare y no se tocan.
name: Server

on:
  push:
    branches: [main]
    paths: ['server/cloudflare/**', 'src/features/live/collabsync.js', 'tests/server.mjs', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node tests/server.mjs
      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/cloudflare
          command: deploy
      - name: No token yet
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::Falta el secreto CLOUDFLARE_API_TOKEN: pruebas pasadas, sin desplegar."
