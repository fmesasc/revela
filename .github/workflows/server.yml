# Deploys Revela's server (server/cloudflare: accounts, cloud documents, sharing, co-editing, LTI, the administration's
# API…) to Cloudflare when it changes, after all the tests pass (tests.yml).
#
# Repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   CLOUDFLARE_API_TOKEN   a token from the «Edit Cloudflare Workers» template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account's ID
# Without them, only the tests run. The Worker's own secrets (Google, Stripe, OpenRouter, mail, LTI…: see
# server/cloudflare/README.md) stay in Cloudflare and are never touched here (wrangler.toml keep_vars).
name: Server

on:
  push:
    branches: [main]
    paths: ['server/cloudflare/**', 'src/features/live/collabsync.js', 'tests/server.mjs', 'tests/server-api.mjs', 'tests/server-lti.mjs', 'tests/server-blender.mjs', 'src/features/live/grading.js', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/cloudflare
          command: deploy
      - name: No token yet
        if: env.HAS_TOKEN != 'true'
        run: echo '::notice::No CLOUDFLARE_API_TOKEN secret (tests passed, nothing deployed).'
