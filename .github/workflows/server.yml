# Deploys Revela's server (server/cloudflare: accounts, cloud documents, sharing, co-editing, LTI, the administration's
# API…) to Cloudflare when it changes, after all the tests pass (tests.yml).
#
# Repository secrets (Settings ▸ Secrets and variables ▸ Actions):
#   CLOUDFLARE_API_TOKEN   a token from the «Edit Cloudflare Workers» template
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account's ID
# Without them, only the tests run. The Worker's own secrets (Google, Stripe, OpenRouter, mail, LTI…: see
# server/cloudflare/README.md) stay in Cloudflare and are never touched here (wrangler.toml keep_vars).
name: Server

# main → the test server (test.revelaslides.com, wrangler.toml [env.staging]); production → production (promote.yml).
on:
  push:
    branches: [main, production]
    # (With every file of the app the server uses: src/core/config.js gives /api/version its number. tests/layers.py checks it.)
    paths:
      - 'server/cloudflare/**'
      - 'src/core/config.js'
      - 'src/features/live/answers.js'
      - 'src/features/live/collabsync.js'
      - 'tests/server.mjs'
      - 'tests/server-api.mjs'
      - 'tests/server-lti.mjs'
      - 'tests/server-blender.mjs'
      - 'src/features/live/grading.js'
      - '.github/workflows/server.yml'
      - 'src/core/busy.js'
      - 'src/core/formulas.js'
      - 'src/core/idb.js'
      - 'src/core/mediastore.js'
      - 'src/core/model.js'
      - 'src/core/store.js'
      - 'src/core/text.js'
      - 'src/core/vendor.js'
      - 'src/features/ai/attach.js'
      - 'src/features/ai/authoring.js'
      - 'src/features/ai/codeobj.js'
      - 'src/features/ai/fromspec.js'
      - 'src/features/ai/media.js'
      - 'src/features/ai/openrouter.js'
      - 'src/features/ai/quality.js'
      - 'src/features/ai/richtext.js'
      - 'src/features/ai/specdeck.js'
      - 'src/features/ai/specs.js'
      - 'src/features/ai/vision.js'
      - 'src/features/animation/transitions.js'
      - 'src/features/content/files.js'
      - 'src/features/content/gltf.js'
      - 'src/features/content/library3d.js'
      - 'src/features/content/maps.js'
      - 'src/features/content/nasa3d.js'
      - 'src/features/content/resources.js'
      - 'src/features/content/stickers.js'
      - 'src/features/content/stl.js'
      - 'src/features/content/stock.js'
      - 'src/features/design/canvasmode.js'
      - 'src/features/design/colormods.js'
      - 'src/features/design/designer.js'
      - 'src/features/design/fonts.js'
      - 'src/features/design/gallery.js'
      - 'src/features/design/palettes.js'
      - 'src/features/document/blocks.js'
      - 'src/features/document/imgshrink.js'
      - 'src/features/document/master.js'
      - 'src/features/live/poll.js'
      - 'src/i18n/index.js'
      - 'src/i18n/strings.js'
      - 'src/render/diagrams.js'
      - 'src/render/icons.js'
      - 'src/render/svg.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  deploy:
    needs: tests
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server/cloudflare
          command: ${{ github.ref_name == 'production' && 'deploy' || 'deploy --env staging' }}
      - name: No token yet
        if: env.HAS_TOKEN != 'true'
        run: echo '::notice::No CLOUDFLARE_API_TOKEN secret (tests passed, nothing deployed).'
