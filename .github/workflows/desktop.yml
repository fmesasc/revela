# Aplicación de escritorio (Tauri 2) para Windows, macOS y Linux.
#
# - Cada push a main: compila y publica los instaladores en la release
#   «latest» (Revela · última versión), que se sustituye en cada subida.
# - Una etiqueta vX.Y.Z: además, una release fija con ese número.
# - También a mano: Actions ▸ Desktop app ▸ Run workflow.
# Los instaladores no están firmados con certificado (Windows y macOS avisan
# al abrirlos la primera vez), pero las actualizaciones sí van firmadas con la
# clave de Revela (secretos TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]): la app
# instalada comprueba latest.json al abrirse y solo acepta paquetes firmados.
name: Desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'tests/**', 'tools/**', 'examples/**']
  workflow_dispatch:

permissions:
  contents: write

# Si se sube otra vez mientras compila, la compilación anterior se cancela.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
            target: universal-apple-darwin      # Apple silicon and Intel in one
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Version: the tag's (v1.2.3 → 1.2.3), else 0.1.<run number> so each
      # build is newer than the last (Windows installers need that to update).
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.1.${GITHUB_RUN_NUMBER}"; fi
          node -e "const f='desktop/src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2))" "$V"
          echo "Versión $V"
      - name: Web app into the bundle
        shell: bash
        run: |
          mkdir -p desktop/dist
          cp -r index.html remote.html view.html vote.html privacy.html terms.html legal.css manifest.webmanifest sw.js icons src desktop/dist/
      - name: Icons
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 icon ../../icons/icon-512.png
      - name: Build
        working-directory: desktop/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: revela-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.deb
            desktop/src-tauri/target/**/release/bundle/**/*.rpm
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      # latest.json: what the installed apps read to update themselves.
      - name: Update manifest
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; TAG="$GITHUB_REF_NAME"; else V="0.1.${GITHUB_RUN_NUMBER}"; TAG=latest; fi
          node - "$V" "$TAG" "$GITHUB_REPOSITORY" <<'JS'
          const fs = require('fs'), path = require('path');
          const [version, tag, repo] = process.argv.slice(2);
          const all = []; (function walk(d) { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, e.name); e.isDirectory() ? walk(p) : all.push(p); } })('out');
          const entry = re => { const f = all.find(x => re.test(x) && !x.endsWith('.sig')); if (!f || !fs.existsSync(f + '.sig')) throw new Error('missing ' + re);
            return { signature: fs.readFileSync(f + '.sig', 'utf8').trim(), url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(path.basename(f))}` }; };
          const mac = entry(/\.app\.tar\.gz$/);
          const manifest = { version, notes: 'Nueva versión de Revela.', pub_date: new Date().toISOString(),
            platforms: { 'windows-x86_64': entry(/-setup\.exe$/), 'linux-x86_64': entry(/\.AppImage$/), 'darwin-aarch64': mac, 'darwin-x86_64': mac } };
          fs.writeFileSync('out/latest.json', JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest, null, 2));
          JS
      - name: Publish
        shell: bash
        run: |
          mapfile -t FILES < <(find out -type f)
          printf '%s\n' "${FILES[@]}"
          NOTES="Instaladores de Revela para escritorio.

          - **Windows:** \`.msi\` o \`…-setup.exe\` (Windows puede avisar de que no está firmado: «Más información ▸ Ejecutar de todos modos»).
          - **macOS:** \`.dmg\` (la primera vez: clic derecho ▸ Abrir).
          - **Linux:** \`.AppImage\` (dale permiso de ejecución), \`.deb\` o \`.rpm\`.

          La versión web siempre está en https://fmesasc.github.io/revela/"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" -R "$GITHUB_REPOSITORY" --title "Revela $GITHUB_REF_NAME" --notes "$NOTES" --latest
          else
            gh release delete latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            gh release create latest "${FILES[@]}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Revela · última versión" --notes "$NOTES

          Compilada desde ${GITHUB_SHA::7}." --latest
          fi
