# The desktop app (Tauri 2) for Windows, macOS and Linux, after all the tests pass (tests.yml).
#
# - Each version published (its tag vX.Y.Z, made by promote.yml): builds the installers and publishes them in a release
#   with that number, kept (Revela 0.4.2…), marked as the latest one — the installed apps update from it.
# - By hand: Actions ▸ Desktop app ▸ Run workflow, on a tag (the same) or a branch (only builds: the installers stay in
#   the run's artifacts, no release).
# Going back to an older version (rollback.yml) doesn't touch it: an installed app doesn't go back to an older number.
# The installers aren't signed with a certificate (Windows and macOS warn the first time they're opened), but the
# updates are signed with Revela's key (secrets TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]): the installed app checks
# latest.json when it opens and only accepts signed packages.
name: Desktop app

on:
  push:
    tags: ['v*']                    # (only published versions: promote.yml)
  workflow_dispatch:

permissions:
  contents: write

# A new push while it builds cancels the previous build.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: ubuntu-22.04-arm                # (ARM64, natively: GitHub's ARM machines, free for public repositories)
            name: linux-arm64
          - os: windows-latest
            name: windows
          - os: windows-latest                  # (ARM64 laptops — Snapdragon —, cross-compiled; only the .exe: the MSI
            name: windows-arm64                 #  bundler, WiX 3, can't make ARM64 installers)
            target: aarch64-pc-windows-msvc
            rust-targets: aarch64-pc-windows-msvc
            bundles: nsis
          - os: macos-latest
            name: macos
            target: universal-apple-darwin      # Apple silicon and Intel in one
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Version: the tag's (v1.2.3 → 1.2.3), which is package.json's in that commit; built from a branch, package.json's.
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(node -p "require('./package.json').version")"; fi
          node -e "const f='desktop/src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2))" "$V"
          echo "Version $V"
      - name: Web app into the bundle
        shell: bash
        run: |
          node tools/build-site.mjs desktop/dist --app-only
      - name: Icons
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 icon ../../icons/icon-512.png
      - name: Build
        working-directory: desktop/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${{ matrix.bundles && format('--bundles {0}', matrix.bundles) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: revela-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.deb
            desktop/src-tauri/target/**/release/bundle/**/*.rpm
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: out
      # latest.json: what the installed apps read to update themselves.
      - name: Update manifest
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"; TAG="$GITHUB_REF_NAME"
          node - "$V" "$TAG" "$GITHUB_REPOSITORY" <<'JS'
          const fs = require('fs'), path = require('path');
          const [version, tag, repo] = process.argv.slice(2);
          const all = []; (function walk(d) { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, e.name); e.isDirectory() ? walk(p) : all.push(p); } })('out');
          const entry = re => { const f = all.find(x => re.test(x) && !x.endsWith('.sig')); if (!f || !fs.existsSync(f + '.sig')) throw new Error('missing ' + re);
            return { signature: fs.readFileSync(f + '.sig', 'utf8').trim(), url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(path.basename(f))}` }; };
          const mac = entry(/\.app\.tar\.gz$/);
          // (Each system and processor its own file — x64 and ARM64 side by side, so by their names, not their extensions.)
          const manifest = { version, notes: `Revela ${version}`, pub_date: new Date().toISOString(),
            platforms: { 'windows-x86_64': entry(/_x64-setup\.exe$/), 'windows-aarch64': entry(/_arm64-setup\.exe$/),
              'linux-x86_64': entry(/_amd64\.AppImage$/), 'linux-aarch64': entry(/_aarch64\.AppImage$/), 'darwin-aarch64': mac, 'darwin-x86_64': mac } };
          fs.writeFileSync('out/latest.json', JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest, null, 2));
          JS
      # An APT repository, flat, inside the release itself: the .deb's index (Packages) and Release, signed with
      # Revela's key (secret APT_SIGNING_KEY; its public part is desktop/apt/revela.asc, also published). APT reads
      # https://github.com/<repo>/releases/latest/download/ (GitHub sends each file there to the latest release's), so
      # Debian and Ubuntu install Revela with apt and update it with apt upgrade. No server: nothing else to keep.
      - name: APT repository
        shell: bash
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir apt && cp $(find out -name '*.deb') apt/ && cd apt
          # (Each package by its name only: it is next to the index, in the same release.)
          dpkg-scanpackages --multiversion . /dev/null | sed 's|^Filename: \./|Filename: |' > Packages
          gzip -9kn Packages && rm -f ./*.deb
          apt-ftparchive -o APT::FTPArchive::Release::Origin=Revela -o APT::FTPArchive::Release::Label=Revela -o APT::FTPArchive::Release::Suite=stable release . > Release
          export GNUPGHOME="$(mktemp -d)"; trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --clearsign -o InRelease Release && gpg --batch --yes -abs -o Release.gpg Release
          cp ../src/desktop/apt/revela.asc .
          mv Packages Packages.gz Release InRelease Release.gpg revela.asc ../out/
      # Fixed names too, for links that never go stale: …/releases/latest/download/Revela-Windows.exe is always the latest
      # version's (revelaslides.com/download links them). After the update manifest and the APT index, which look for the
      # versioned files and would find these too.
      - name: Fixed names
        shell: bash
        run: |
          set -euo pipefail
          pick() { find out -type f -name "$1" ! -name '*.sig' | head -n 1; }
          cp "$(pick '*_x64-setup.exe')" out/Revela-Windows.exe
          cp "$(pick '*_x64_en-US.msi')" out/Revela-Windows.msi
          cp "$(pick '*_arm64-setup.exe')" out/Revela-Windows-ARM64.exe
          cp "$(pick '*.dmg')" out/Revela-macOS.dmg
          cp "$(pick '*_amd64.AppImage')" out/Revela-Linux.AppImage
          cp "$(pick '*_amd64.deb')" out/Revela-Linux.deb
          cp "$(pick '*.x86_64.rpm')" out/Revela-Linux.rpm
          cp "$(pick '*_aarch64.AppImage')" out/Revela-Linux-ARM64.AppImage
          cp "$(pick '*_arm64.deb')" out/Revela-Linux-ARM64.deb
          cp "$(pick '*.aarch64.rpm')" out/Revela-Linux-ARM64.rpm
      - name: Publish
        shell: bash
        run: |
          mapfile -t FILES < <(find out -type f)
          printf '%s\n' "${FILES[@]}"
          # What the version brings: its tag's message (promote.yml), then how to install.
          git -C src tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '1{/^Revela /d}' > notes.md
          cat >> notes.md <<'MD'

          ### Instalar
          Todo explicado, en 11 idiomas: https://revelaslides.com/download — o con un solo comando:
          - **Windows** (PowerShell): `irm https://revelaslides.com/install.ps1 | iex`
          - **macOS y Linux** (terminal): `curl -fsSL https://revelaslides.com/install.sh | sh`

          - **Windows:** `.msi` o `…-setup.exe` (Windows puede avisar de que no está firmado: «Más información ▸ Ejecutar de todos modos»).
          - **macOS:** `.dmg` (la primera vez: clic derecho ▸ Abrir).
          - **Debian y Ubuntu, con apt** (se actualiza con el sistema, con `sudo apt upgrade`). Una sola vez:
            ```
            sudo curl -fsSLo /usr/share/keyrings/revela.asc https://github.com/fmesasc/revela/releases/latest/download/revela.asc
            echo "deb [signed-by=/usr/share/keyrings/revela.asc] https://github.com/fmesasc/revela/releases/latest/download ./" | sudo tee /etc/apt/sources.list.d/revela.list
            sudo apt update && sudo apt install revela
            ```
          - **Linux:** `.AppImage` (dale permiso de ejecución), `.deb` o `.rpm`. Para el `.deb` suelto, en la carpeta de la descarga: `sudo apt install ./Revela_*_amd64.deb` (instala también lo que le falte). Si entras como root con `su`, usa `su -`: sin el guion, `dpkg` no encuentra `ldconfig` ni `start-stop-daemon`.

          Las aplicaciones ya instaladas se actualizan solas. La versión web siempre está en https://revelaslides.com/app/
          MD
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" -R "$GITHUB_REPOSITORY" --verify-tag --title "Revela ${GITHUB_REF_NAME#v}" --notes-file notes.md --latest
          # (The old «latest» release, replaced each time until versions were kept: gone.)
          gh release delete latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true

  # winget (Windows): each published version, a pull request to microsoft/winget-pkgs updating FMLab.Revela — its
  # installers, SHA-256 and the rest kept from the version before —, opened from the fork fmesasc/winget-pkgs by
  # winget-releaser. It needs the secret WINGET_TOKEN (a classic GitHub token with only «public_repo»); without it, this
  # is skipped. Not «needs» of anything: a refusal there never holds up a release. (Homebrew follows the releases from
  # its own repository, fmesasc/homebrew-revela: no token.)
  winget:
    needs: release
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: winget-pkgs pull request
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: FMLab.Revela
          installers-regex: '_(x64|arm64)-setup\.exe$|_x64_en-US\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
      - if: env.HAS_TOKEN != 'true'
        run: "echo 'Sin WINGET_TOKEN, la versión no se envía a winget (desktop/winget/README.md).'"
