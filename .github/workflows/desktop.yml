# Aplicación de escritorio (Tauri 2) para Windows, macOS y Linux.
# Se lanza a mano (Actions ▸ Desktop app ▸ Run workflow) o al publicar una
# etiqueta vX.Y.Z; los instaladores quedan como artefactos de la ejecución
# (y, con etiqueta, en una Release). No están firmados: Windows y macOS
# avisarán la primera vez que se abran.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Web app into the bundle
        shell: bash
        run: |
          mkdir -p desktop/dist
          cp -r index.html remote.html view.html vote.html privacy.html terms.html legal.css manifest.webmanifest sw.js icons src desktop/dist/
      - name: Icons
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 icon ../../icons/icon-512.png
      - name: Build
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: revela-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
            desktop/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/target/release/bundle/**/*.dmg
            desktop/src-tauri/target/release/bundle/**/*.deb
            desktop/src-tauri/target/release/bundle/**/*.rpm
            desktop/src-tauri/target/release/bundle/**/*.AppImage
