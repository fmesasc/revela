# The desktop app (Tauri 2) for Windows, macOS and Linux, after all the tests pass (tests.yml).
#
# - Each change of production (the branch produccion: promote.yml): builds and publishes the installers in the
#   «latest» release (Revela · latest version), replaced each time.
# - A vX.Y.Z tag: also a fixed release with that number.
# - By hand too: Actions ▸ Desktop app ▸ Run workflow.
# The installers aren't signed with a certificate (Windows and macOS warn the first time they're opened), but the
# updates are signed with Revela's key (secrets TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]): the installed app checks
# latest.json when it opens and only accepts signed packages.
name: Desktop app

on:
  push:
    branches: [produccion]          # (installed apps update only to what's in production: promote.yml)
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'tests/**', 'examples/**']   # (not tools/: build-site.mjs makes the bundle)
  workflow_dispatch:

permissions:
  contents: write

# A new push while it builds cancels the previous build.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
            target: universal-apple-darwin      # Apple silicon and Intel in one
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Version: the tag's (v1.2.3 → 1.2.3), else package.json's major.minor and the run number (0.3.<run>), so each
      # build is newer than the last (Windows installers need that to update). Before tagging a release, raise
      # package.json's minor version (and src/core/config.js APP_VERSION: tests/layers.py checks they match).
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${GITHUB_RUN_NUMBER}"; fi
          node -e "const f='desktop/src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2))" "$V"
          echo "Version $V"
      - name: Web app into the bundle
        shell: bash
        run: |
          node tools/build-site.mjs desktop/dist --app-only
      - name: Icons
        working-directory: desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2 icon ../../icons/icon-512.png
      - name: Build
        working-directory: desktop/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: revela-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/**/*.msi
            desktop/src-tauri/target/**/release/bundle/**/*.exe
            desktop/src-tauri/target/**/release/bundle/**/*.dmg
            desktop/src-tauri/target/**/release/bundle/**/*.deb
            desktop/src-tauri/target/**/release/bundle/**/*.rpm
            desktop/src-tauri/target/**/release/bundle/**/*.AppImage
            desktop/src-tauri/target/**/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      # latest.json: what the installed apps read to update themselves.
      - name: Update manifest
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; TAG="$GITHUB_REF_NAME"; else V="0.1.${GITHUB_RUN_NUMBER}"; TAG=latest; fi
          node - "$V" "$TAG" "$GITHUB_REPOSITORY" <<'JS'
          const fs = require('fs'), path = require('path');
          const [version, tag, repo] = process.argv.slice(2);
          const all = []; (function walk(d) { for (const e of fs.readdirSync(d, { withFileTypes: true })) { const p = path.join(d, e.name); e.isDirectory() ? walk(p) : all.push(p); } })('out');
          const entry = re => { const f = all.find(x => re.test(x) && !x.endsWith('.sig')); if (!f || !fs.existsSync(f + '.sig')) throw new Error('missing ' + re);
            return { signature: fs.readFileSync(f + '.sig', 'utf8').trim(), url: `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(path.basename(f))}` }; };
          const mac = entry(/\.app\.tar\.gz$/);
          const manifest = { version, notes: 'Nueva versión de Revela.', pub_date: new Date().toISOString(),
            platforms: { 'windows-x86_64': entry(/-setup\.exe$/), 'linux-x86_64': entry(/\.AppImage$/), 'darwin-aarch64': mac, 'darwin-x86_64': mac } };
          fs.writeFileSync('out/latest.json', JSON.stringify(manifest, null, 2));
          console.log(JSON.stringify(manifest, null, 2));
          JS
      - name: Publish
        shell: bash
        run: |
          mapfile -t FILES < <(find out -type f)
          printf '%s\n' "${FILES[@]}"
          NOTES="Instaladores de Revela para escritorio.

          - **Windows:** \`.msi\` o \`…-setup.exe\` (Windows puede avisar de que no está firmado: «Más información ▸ Ejecutar de todos modos»).
          - **macOS:** \`.dmg\` (la primera vez: clic derecho ▸ Abrir).
          - **Linux:** \`.AppImage\` (dale permiso de ejecución), \`.deb\` o \`.rpm\`.

          La versión web siempre está en https://fmesasc.github.io/revela/"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" -R "$GITHUB_REPOSITORY" --title "Revela $GITHUB_REF_NAME" --notes "$NOTES" --latest
          else
            gh release delete latest -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            gh release create latest "${FILES[@]}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Revela · última versión" --notes "$NOTES

          Compilada desde ${GITHUB_SHA::7}." --latest
          fi
