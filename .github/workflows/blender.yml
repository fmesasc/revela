# Deploys revela-blender (server/blender: Blender on Cloudflare Containers, for «Crear modelo 3D con IA») when it
# changes, after its tests pass. It ONLY deploys if the repository has BLENDER_DEPLOY = 1 (a variable or secret in
# Settings ▸ Secrets and variables ▸ Actions): Containers needs the Workers paid plan, and without it the deploy fails.
#
# The same secrets as server.yml (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID); the token also needs the Containers
# permission (the «Edit Cloudflare Workers» template + Account ▸ Containers ▸ Edit). The Worker's own secret
# (BLENDER_SECRET) is set once in Cloudflare and never touched here.
# `wrangler deploy` builds the image (Dockerfile: official Blender LTS, version and SHA-256 pinned) with the runner's
# Docker and uploads it to Cloudflare's registry.

name: Blender

on:
  push:
    branches: [main]
    paths: ['server/blender/**', 'tests/server-blender.mjs', '.github/workflows/blender.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blender
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENABLED: ${{ vars.BLENDER_DEPLOY == '1' || secrets.BLENDER_DEPLOY == '1' }}
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node tests/server-blender.mjs && python3 -m py_compile server/blender/runner.py server/blender/run.py
      - name: Deploy to Cloudflare
        if: env.ENABLED == 'true' && env.HAS_TOKEN == 'true'
        working-directory: server/blender
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm install --no-audit --no-fund && npx wrangler deploy
      - name: Not enabled
        if: env.ENABLED != 'true' || env.HAS_TOKEN != 'true'
        run: echo '::notice::revela-blender no se despliega (falta BLENDER_DEPLOY=1 o CLOUDFLARE_API_TOKEN); pruebas pasadas.'
