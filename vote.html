<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revela · Votar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233f6497'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
  <style>
    :root{--accent:#3f6497;--bg:#11151c;--panel:#1b212b;--line:#2c3542;--txt:#eef1f5;--txt2:#9aa4b2}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
    header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
    header b{color:#7fa6d8}
    #status{margin-left:auto;font-size:12px;color:var(--txt2)} #status.on{color:#4ec06a}
    main{max-width:560px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
    h1{font-size:22px;margin:0}
    p{color:var(--txt2);margin:0}
    input[type=text]{font-size:20px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);width:100%}
    #code{font-size:32px;letter-spacing:8px;text-transform:uppercase;text-align:center;font-weight:700}
    button{font:600 17px system-ui,sans-serif;border:none;border-radius:12px;padding:15px;background:var(--accent);color:#fff;cursor:pointer}
    button:disabled{opacity:.5}
    .opt{background:var(--panel);border:2px solid var(--line);text-align:left;color:var(--txt)}
    .opt.on{border-color:#7fa6d8;background:#233148}
    /* Quiz: big coloured answers, the time left, and how it went */
    .quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .quiz-opt{min-height:88px;border:0;border-radius:10px;color:#fff;font-weight:700;font-size:17px;padding:10px}
    .quiz-opt:disabled{opacity:.45}.quiz-opt.on{outline:4px solid #fff;opacity:1}
    .quiz-top{display:flex;gap:8px;align-items:center;margin-bottom:10px}.quiz-top input{flex:1}
    .quiz-left{font-size:22px;font-weight:800;min-width:3ch;text-align:right}
    .quiz-res{text-align:center;padding:18px;border-radius:12px;font-size:20px;margin-top:12px}.quiz-res b{display:block;font-size:34px}
    #slide-view{position:relative;border-radius:10px;overflow:hidden;background:#000}#slide-view iframe{border:0;transform-origin:0 0;display:block}
    #slide-n{position:absolute;right:8px;bottom:6px;font-size:12px;color:#fff;background:#0008;border-radius:8px;padding:1px 6px}
    #cc{position:sticky;bottom:0;background:#000d;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;order:99}
    #cc-text{font-size:20px;line-height:1.35;min-height:1.35em}#cc-text i{opacity:.6;font-style:normal}#cc label{font-size:13px;color:var(--txt2)}#cc select{font-size:14px;padding:4px 8px}#cc-note{color:var(--txt2)}
    .act-row{display:flex;gap:8px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 10px}
    .act-row span{flex:1}.act-row button{min-width:44px;padding:8px}
    select{font-size:17px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);color-scheme:dark}.act-row select{flex:1;max-width:62%}
    .act-num{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:13px;background:#3f6497;color:#fff;font-weight:700}
    .act-text{line-height:2.4;font-size:18px}.act-text input[type=text]{width:7em;display:inline-block;margin:0 4px;padding:4px 8px;font-size:18px;border-radius:8px;border-color:#7fa6d8}
    .act-pic{position:relative}.act-pic img{width:100%;display:block;border-radius:8px}.act-pic .act-num{position:absolute;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 1px 4px #0008}
    .stars{display:flex;gap:8px;justify-content:center}.stars button{flex:1;font-size:24px;padding:14px 0}
    .ok{color:#4ec06a;font-weight:600}.err{color:#ff8080;min-height:18px;font-size:14px}
    textarea{font:17px system-ui,sans-serif;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);width:100%;resize:vertical}
    .qa-item{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
    .qa-up{flex:0 0 auto;padding:8px 12px;font-size:15px}
    #read-bar{display:flex;justify-content:flex-end}#read-bar button{padding:8px 14px;font-size:15px}#read-bar button[aria-pressed="true"]{outline:3px solid #7fa6d8}
    #read-box{border-radius:12px;padding:16px 18px;background:#fbf6e9;color:#1d1d1f;font:var(--rs,21px)/1.7 Verdana,Tahoma,Arial,sans-serif;letter-spacing:.04em;word-spacing:.16em;text-align:left}
    #read-box *{font-style:normal!important}#read-box h2{font-size:1.2em;line-height:1.4;margin:0 0 .6em}#read-box p{margin:0 0 .7em}#read-box ul{margin:0 0 .7em;padding-left:1.3em}
    #read-box li{margin:0 0 .3em}#read-box li.l2{margin-left:1.2em}#read-box li.l3{margin-left:2.4em}#read-box .rv-ri{border-left:5px solid #c9b88a;padding-left:.7em;color:#4a4436}#read-box .rv-rq{font-weight:700}
    #read-box .rv-rb{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}#read-box .rv-rb button{font:15px/1 Verdana,Tahoma,Arial,sans-serif;letter-spacing:0;padding:9px 13px;background:#fff;color:#1d1d1f;border:1px solid #d8ccb0}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <header><b>Revela</b> <span>· Votar</span><span id="status">Sin conectar</span></header>
  <main>
    <div id="slide-view" hidden><iframe title="Diapositiva" sandbox="" scrolling="no"></iframe><small id="slide-n"></small></div>
    <div id="read-bar" hidden><button id="read-go" type="button" aria-pressed="false">Aa · Lectura fácil</button></div>
    <div id="read-box" hidden><div class="rv-rb"><button id="read-say" type="button">▶ Leer en voz alta</button><button id="read-sm" type="button" aria-label="Letra más pequeña">A−</button><button id="read-lg" type="button" aria-label="Letra más grande">A+</button></div><div id="read-text" aria-live="polite"></div></div>
    <div id="cc" hidden><div id="cc-text" aria-live="polite"></div>
      <label>Subtítulos: <select id="cc-lang"><option value="">Original</option><option value="es">Español</option><option value="en">English</option><option value="fr">Français</option>
        <option value="de">Deutsch</option><option value="it">Italiano</option><option value="pt">Português</option><option value="ca">Català</option><option value="gl">Galego</option>
        <option value="eu">Euskara</option><option value="nl">Nederlands</option><option value="ar">العربية</option><option value="uk">Українська</option><option value="ro">Română</option><option value="zh">中文</option></select></label>
      <small id="cc-note"></small></div>
    <section id="join">
      <h1>Introduce el código</h1>
      <p>Aparece en la pantalla de la presentación, junto al QR.</p><br>
      <input id="code" type="text" maxlength="5" autocomplete="off" autocapitalize="characters">
      <br><br><button id="go" style="width:100%">Entrar</button>
      <div id="err" class="err"></div>
    </section>
    <section id="poll" hidden>
      <h1 id="q"></h1>
      <div id="answers" style="display:flex;flex-direction:column;gap:10px;margin-top:12px"></div>
      <button id="send" style="margin-top:12px;width:100%">Enviar</button>
      <div id="done" class="ok" hidden>✔ ¡Voto registrado! Puedes cambiarlo mientras la pregunta siga abierta.</div>
    </section>
    <section id="wait" hidden><h1>Esperando la siguiente pregunta…</h1><p>Mantén esta página abierta.</p></section>
  </main>
  <script type="module" src="src/apps/vote/main.js"></script>
</body>
</html>
