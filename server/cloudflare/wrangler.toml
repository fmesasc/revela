name = "revela-share"
main = "worker.js"
compatibility_date = "2026-09-01"
# Served at https://<name>.<account>.workers.dev; no extra preview addresses per version.
workers_dev = true
preview_urls = false
# Variables set in Cloudflare's dashboard stay through deploys (the business's numbers live there).
keep_vars = true
# The official site (Cloudflare Pages) sends its /api/… here; the rest of the domain stays with the site.
routes = [{ pattern = "revelaslides.com/api/*", zone_name = "revelaslides.com" }, { pattern = "admin.revelaslides.com/api/*", zone_name = "revelaslides.com" }, { pattern = "revelaslides.com/community*", zone_name = "revelaslides.com" }, { pattern = "revelaslides.com/comunidad*", zone_name = "revelaslides.com" }, { pattern = "revelaslides.com/.well-known/oauth*", zone_name = "revelaslides.com" }]
# admin.revelaslides.com/api/*: the administration (admin.js), behind Cloudflare Access.

# Everything is stored in Durable Objects (store.js), not R2: on the Workers Free
# plan they have hard limits (it stops for the day, it never bills).
[[durable_objects.bindings]]
name = "SHAREBOX"
class_name = "ShareBox"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "Limits"

[vars]
# The largest presentation, in MB, that can be saved in Revela's cloud (docs.js).
MAX_MB = "30"
# Per Google account (or address) and in total, per day: shares + rooms created.
DAILY_PER_USER = "30"
DAILY_TOTAL = "3000"
# Accounts API (api.js). Origins allowed to use it with their session cookie,
# and the site the payments come back to.
API_ORIGINS = "https://revelaslides.com"
SITE_URL = "https://revelaslides.com"
# The business's numbers are NOT here: they are set in Cloudflare (Workers ▸ revela-share ▸
# Settings ▸ Variables and secrets), so they can be changed there without a commit and are not
# public. Without them the code's defaults apply (api.js, settings()):
#   TRIAL_CREDITS 50 · PRO_CREDITS 1000 · CREDIT_USD 0.002 (what one credit pays for in the AI
#   provider's dollars) · MARKUP 1 (× the AI's real cost) · IMAGE_CREDITS 15 · MONTHLY_BUDGET_USD 50
#   TRIAL_DAYS 90 · PACK_DAYS 365 · MONTH_DAYS 60 (how long credits last)
# Cloud documents per account (free / Pro) and people per document.
FREE_DOCS = "3"
PRO_DOCS = "500"
MAX_PEOPLE = "50"
AI_PER_MINUTE = "20"
# Every account's AI together, per calendar month (MONTHLY_BUDGET_USD): set in Cloudflare, see above.
# Models people may use (the first is the default) and their prices per million
# tokens [input, output] in dollars, for the estimate made before each request
# (check them at openrouter.ai/models; the real cost is charged afterwards).
AI_MODELS = "openai/gpt-4o-mini,google/gemini-2.5-flash,anthropic/claude-haiku-4.5,google/gemini-2.5-flash-lite"
# Voice-over (text to speech): model, voices, and a cautious price per character (check the model page).
AI_TTS_MODEL = "openai/gpt-4o-mini-tts-2025-12-15"
AI_TTS_USD_PER_CHAR = "0.00002"
AI_PRICES = '{"openai/gpt-4o-mini":[0.15,0.6],"google/gemini-2.5-flash":[0.3,2.5],"google/gemini-2.5-flash-lite":[0.1,0.4],"anthropic/claude-haiku-4.5":[1,5],"google/gemini-3.8-flash":[0.75,3.75]}'
# «Crear modelo 3D con IA» (model3d.js): the vision model that writes the Blender scripts (its price is in
# AI_PRICES above), and what one second of the Blender container costs, in dollars (see docs/NUBE.md).
AI_3D_MODEL = "google/gemini-3.8-flash"
BLENDER_USD_PER_SECOND = "0.0001"
# BLENDER_URL (the revela-blender Worker, e.g. https://revela-blender.<account>.workers.dev) is set in
# Cloudflare with the secret BLENDER_SECRET; without both the feature is off (503 'not configured').
# Emails (mail.js). From whom (optional; default "Revela <avisos@revelaslides.com>"):
# MAIL_FROM = "Revela <avisos@revelaslides.com>"
# Secrets: MAIL_SECRET (signs the links to stop optional notices: `openssl rand -base64 32 |
# npx wrangler secret put MAIL_SECRET`) and, only when not using Cloudflare Email Service,
# RESEND_KEY (Resend's API key). Terms of service in force (their date; bump it to ask again):
# TERMS_VERSION = "2026-10-01"
# Revela's Google client (public, as in src/core/config.js): people signed in to
# Revela with Google can share and open collaboration rooms. To limit it to
# some accounts: `npx wrangler secret put ALLOWED` with e.g. "ana@x.org, @school.example".
GOOGLE_CLIENT_ID = "960102070599-jahg4mdj304k5ftb9b6p2ck9hp5gtbc9.apps.googleusercontent.com"
# Administration (admin.js): the Cloudflare Access application that protects admin.revelaslides.com
# (public identifiers: its team and audience tag). Who may use it, ADMIN_EMAILS, is set in Cloudflare.
ACCESS_TEAM = "fmesasc"
ACCESS_AUD = "fc9aec28ca0051d675aa082759b71159082d80e463840d6fdaa8d1eb647d8aa7"
# Stripe prices (public identifiers; the keys are secrets in Cloudflare). Live (an empty one = that
# product can't be bought yet):
STRIPE_PRICE_PRO_MONTH = "price_1UMtlaRl48v6ZHv1voX3BPL4"
STRIPE_PRICE_PRO_YEAR = "price_1UMtmeRl48v6ZHv1Zc8LVySv"
STRIPE_PRICE_CREDITS_500 = "price_1UMto2Rl48v6ZHv1d4WPv1rB"
STRIPE_PRICE_CREDITS_1500 = "price_1UMtpURl48v6ZHv1fMWf7uk7"
STRIPE_PRICE_TEAM_SEAT = "price_1UMtrORl48v6ZHv1FzeMstm8"
# Test (the sandbox):
STRIPE_TEST_PRICE_PRO_MONTH = "price_1UMtT0Dp2aJKxbrm4VXXI2AL"
STRIPE_TEST_PRICE_PRO_YEAR = "price_1UMtUUDp2aJKxbrmE3VSTZ3w"
STRIPE_TEST_PRICE_CREDITS_500 = "price_1UMtW5Dp2aJKxbrmIkglvXQN"
STRIPE_TEST_PRICE_CREDITS_1500 = "price_1UMtWlDp2aJKxbrmaAhEy7JR"
STRIPE_TEST_PRICE_TEAM_SEAT = "price_1UMtYiDp2aJKxbrmqE97zQHu"

# Live collaboration rooms (collab.js): one Durable Object per shared session.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "CollabRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CollabRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ShareBox", "Limits"]

# Accounts API (api.js): one object per account, the global AI budget, and
# desktop sign-ins. Secrets (never in this file): `npx wrangler secret put …`
#   OPENROUTER_KEY          the AI key (set a credit limit on it at openrouter.ai)
#   STRIPE_SECRET_KEY       Stripe's secret key (billing; optional until you sell)
#   STRIPE_WEBHOOK_SECRET   the signing secret of the webhook (…/api/billing/webhook)
#   STRIPE_TEST_SECRET_KEY, STRIPE_TEST_WEBHOOK_SECRET   Stripe's test mode (…/api/billing/webhook-test; optional:
#                           accounts an admin puts in test mode, or everyone with the var STRIPE_MODE = "test")
# Plain vars set in the dashboard: STRIPE_PRICE_* and STRIPE_TEST_PRICE_* (PRO_MONTH, PRO_YEAR, CREDITS_500,
# CREDITS_1500, TEAM_SEAT), STRIPE_MODE (live | test; default live). See docs/NUBE.md.
#   UNSPLASH_ACCESS_KEY     Unsplash's access key (photos; optional)
#   PEXELS_API_KEY          Pexels' API key (photos; optional)
#   CALLS_APP_ID, CALLS_APP_SECRET   Cloudflare Realtime SFU app (video calls; optional)
#   TURN_KEY_ID, TURN_KEY_API_TOKEN  Cloudflare Realtime ▸ TURN Server: relays for the phone remote, votes and live collaboration (optional; without them, STUN only)
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Account"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "Budget"

[[durable_objects.bindings]]
name = "DESKTOP"
class_name = "DesktopLink"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Account", "Budget", "DesktopLink"]

# Presentations saved in the cloud (docs.js): one object per document.
[[durable_objects.bindings]]
name = "DOCS"
class_name = "CloudDoc"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["CloudDoc"]

# Teams (teams.js): one object per team (seats, members, brand kit, templates).
[[durable_objects.bindings]]
name = "TEAMS"
class_name = "Team"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["Team"]

# LTI 1.3 (lti.js): platforms, logins and students' sessions. Secret: LTI_PRIVATE_JWK
# (`node tools/lti-key.mjs | npx wrangler secret put LTI_PRIVATE_JWK`).
[[durable_objects.bindings]]
name = "LTI"
class_name = "LtiStore"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["LtiStore"]

# Video calls (calls.js): who is in each presentation's call.
[[durable_objects.bindings]]
name = "CALLS"
class_name = "CallRoom"

[[migrations]]
tag = "v7"
new_sqlite_classes = ["CallRoom"]

# Scheduled notices (schedule.js): the accounts note here what to look at on which day,
# and a daily cron goes through it (credits that expire, the end of Pro, unused accounts).
[[durable_objects.bindings]]
name = "SCHEDULE"
class_name = "Schedule"

[[migrations]]
tag = "v8"
new_sqlite_classes = ["Schedule"]

[triggers]
crons = ["0 8 * * *"]

# «Crear modelo 3D con IA» (model3d.js): one object per job (its rounds, the GLB; deleted after 24 h).
# Blender runs in another Worker, revela-blender (server/blender), reached at BLENDER_URL with the
# secret BLENDER_SECRET (`npx wrangler secret put BLENDER_SECRET`, the same value in both Workers).
# Optionally, a service binding to it (BLENDER_SVC: [[services]] binding = "BLENDER_SVC", service = "revela-blender"):
# then model3d.js calls it directly instead of over the internet; without it, BLENDER_URL is fetched.
[[durable_objects.bindings]]
name = "MODELJOBS"
class_name = "ModelJob"

[[migrations]]
tag = "v9"
new_sqlite_classes = ["ModelJob"]

# Emails with Cloudflare Email Service (Compute ▸ Email Service ▸ Email Sending ▸ Onboard
# Domain: revelaslides.com, then its DNS records). Uncomment once the domain is onboarded;
# without it (and without RESEND_KEY) no email is sent.
# [[send_email]]
# name = "EMAIL"

# Administration (admin.js): the users directory, support tickets and the audit log. The API
# is OFF (404) until these three plain vars are set — in Cloudflare (Workers ▸ revela-share ▸
# Settings ▸ Variables) or here — and it only answers on admin.revelaslides.com, behind a
# Cloudflare Access application whose token this Worker checks itself on every request:
# ACCESS_TEAM, ACCESS_AUD: in [vars] above. ADMIN_EMAILS = "admin@example.com" (set in Cloudflare)
# ADMIN_HOST = "admin.revelaslides.com"  (optional; that is the default)
# Support tickets per day: SUPPORT_PER_DAY (per address or account, default 5), SUPPORT_DAILY_TOTAL
# (default 500), SUPPORT_ATTACH_KB (largest attached presentation, default 1500).
# Answers in a ticket from the signed link in its emails (needs MAIL_SECRET): SUPPORT_REPLIES_PER_DAY
# (per address and per ticket, default 10); who is told: SUPPORT_NOTIFY (default the first of ADMIN_EMAILS).
# The daily cron reminds once about tickets waiting for the person after SUPPORT_REMIND_DAYS (default 7)
# and closes them after SUPPORT_AUTOCLOSE_DAYS (default 21) since the answer; 0 turns either off.
# AI help to answer a ticket (needs OPENROUTER_KEY; paid from MONTHLY_BUDGET_USD, not the person's credits):
# SUPPORT_AI_MODEL (default google/gemini-2.5-flash); SUPPORT_AI_AUTO = "1" asks for it when a ticket is first opened.
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[durable_objects.bindings]]
name = "TICKETS"
class_name = "Tickets"

[[durable_objects.bindings]]
name = "AUDIT"
class_name = "Audit"

[[migrations]]
tag = "v10"
new_sqlite_classes = ["Directory", "Tickets", "Audit"]

# The business's accounts (finance.js), for the admin's «Negocio» page: every economic event (AI and its
# provider's cost, Blender seconds, emails, Stripe payments with their fee, refunds, cancellations, credits
# granted / used / expired, new and active accounts) as daily sums kept forever, the raw events of the last
# 90 days (payments and refunds always), and the fixed costs and hours entered by hand. Plain vars (set in
# Cloudflare, see docs/NUBE.md): USD_EUR (default 0.86), EMAIL_USD (default 0), STRIPE_FEE_PCT (1.5) and
# STRIPE_FEE_FIXED (0.25), used only when Stripe's balance transaction can't be read.
[[durable_objects.bindings]]
name = "FINANCE"
class_name = "Finance"

[[migrations]]
tag = "v11"
new_sqlite_classes = ["Finance"]

# Captación (crm.js), for the admin's «Captación» page: schools and businesses (found in OpenStreetMap,
# imported or from the website's form), follow-ups and reminders, email sequences — only to who gave
# consent, never to one who unsubscribed — and the campaigns' links (/api/go/<slug>) with their visits,
# sign-ups, requests and purchases. The daily cron above sends what is due and a summary to the admin.
# Optional plain var: LEADS_PER_DAY (requests from the form per address and day; default 5).
[[durable_objects.bindings]]
name = "CRM"
class_name = "Crm"

[[migrations]]
tag = "v12"
new_sqlite_classes = ["Crm"]

# The community gallery (community.js): presentations teachers publish (after the admin approves them), their
# pages at revelaslides.com/comunidad (the route above) and «Usar esta presentación». Optional plain var:
# COMMUNITY_MAX_MB (largest presentation, default 15).
[[durable_objects.bindings]]
name = "COMMUNITY"
class_name = "Community"

[[migrations]]
tag = "v13"
new_sqlite_classes = ["Community"]

# The «Rastreador» of Captación (crawler.js): visits the websites of the CRM's schools and businesses, slowly and
# obeying robots.txt, and notes what they say with a score. Off until the admin turns it on (Captación ▸ Rastreador).
[[durable_objects.bindings]]
name = "CRAWLER"
class_name = "Crawler"

[[migrations]]
tag = "v14"
new_sqlite_classes = ["Crawler"]

# The website's visits, counted without cookies (visits.js), its 404s and the sitemap's extra addresses.
[[durable_objects.bindings]]
name = "VISITS"
class_name = "Visits"

[[migrations]]
tag = "v15"
new_sqlite_classes = ["Visits"]

# Live broadcasts to a big audience (broadcast.js): one room per broadcast, WebSocket hibernation.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "Broadcast"

[[migrations]]
tag = "v16"
new_sqlite_classes = ["Broadcast"]

# ---- Pruebas (staging): test.revelaslides.com ------------------------------------------------------------
# The same Worker as «revela-share-staging», with its own Durable Objects (its own accounts, documents and the
# rest: nothing is shared with production), deployed from main by server.yml after the tests; production comes from
# the branch production, when the admin says so (promote.yml). Bindings and vars aren't inherited, so they are all
# here again (tests/layers.py checks the same objects are bound in both). Stripe in test mode; no administration
# (no ACCESS_*: admin.revelaslides.com is production's). Its secrets are its own: npx wrangler secret put NAME --env staging.
[env.staging]
routes = [{ pattern = "test.revelaslides.com/api/*", zone_name = "revelaslides.com" }, { pattern = "test.revelaslides.com/community*", zone_name = "revelaslides.com" }, { pattern = "test.revelaslides.com/comunidad*", zone_name = "revelaslides.com" }, { pattern = "test.revelaslides.com/.well-known/oauth*", zone_name = "revelaslides.com" }]

[env.staging.vars]
STAGE = "test"
API_ORIGINS = "https://test.revelaslides.com"
SITE_URL = "https://test.revelaslides.com"
STRIPE_MODE = "test"
MONTHLY_BUDGET_USD = "5"
MAX_MB = "30"
DAILY_PER_USER = "30"
