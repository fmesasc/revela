[package]
name = "revela"
version = "0.1.0"
description = "Revela: editor de presentaciones"
license = "MIT"
authors = ["fmesasc"]
homepage = "https://fmesasc.github.io/revela/"
repository = "https://github.com/fmesasc/revela"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde_json = "1"          # used by tauri::generate_context! for the plugins configuration

# (Linux: tauri-plugin-deep-link 2.6 builds rust-ini's ParseOption field by field, and rust-ini 0.21.3 added fields —
# «missing fields enabled_indented_mutiline_value…». Held at 0.21.1 until the plugin catches up.)
[target.'cfg(target_os = "linux")'.dependencies]
rust-ini = "=0.21.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
