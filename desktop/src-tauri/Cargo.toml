[package]
name = "revela"
version = "0.1.0"
description = "Revela: editor de presentaciones"
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde_json = "1"          # used by tauri::generate_context! for the plugins configuration

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
