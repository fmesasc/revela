<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
  <meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Revela</title>
</head>
<body>
<script>
  // Dropbox's "Open with ▸ Revela" (its Extension URI): on to the editor with the
  // file it asks for (?file_id=…), which asks whether to view or edit it.
  location.replace('./?dropbox&' + location.search.slice(1));
</script>
</body>
</html>
