<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Revela · Mando</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233f6497'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' fill='white' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
  <style>
    :root{--accent:#3f6497;--bg:#11151c;--panel:#1b212b;--line:#2c3542;--txt:#eef1f5;--txt2:#9aa4b2}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent}
    body{display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
    header .brand{font-weight:800;color:#7fa6d8}
    header .status{margin-left:auto;font-size:12px;color:var(--txt2)}
    header .status.on{color:#4ec06a}
    main{flex:1;display:flex;flex-direction:column;min-height:0}
    .screen{flex:1;display:none;flex-direction:column;padding:16px;gap:14px}
    .screen.active{display:flex}
    /* connect */
    #connect{justify-content:center;align-items:center;text-align:center}
    #connect h1{font-size:19px;margin:0}
    #connect p{color:var(--txt2);font-size:14px;margin:0 0 4px}
    #code{font-size:34px;letter-spacing:8px;text-transform:uppercase;text-align:center;width:100%;max-width:320px;
      padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-weight:700}
    button{font-family:inherit;font-size:16px;border:none;border-radius:12px;padding:14px;background:var(--accent);
      color:#fff;cursor:pointer;font-weight:600}
    button.ghost{background:var(--panel);border:1px solid var(--line);color:var(--txt)}
    button:disabled{opacity:.5}
    .err{color:#ff8080;font-size:13px;min-height:18px}
    /* control */
    .meta{display:flex;align-items:baseline;gap:10px}
    .meta .pos{font-size:15px;color:var(--txt2)}
    .meta .title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .meta{display:flex;align-items:baseline;gap:10px}
    .meta .timer{margin-left:auto;font-variant-numeric:tabular-nums;color:#7fa6d8;font-weight:700}
    .notes{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px;line-height:1.5}
    .notes .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);margin-bottom:6px}
    .next{color:var(--txt2);font-size:14px;border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
    .nav{display:flex;gap:12px}
    .nav button{flex:1;font-size:20px;padding:20px}
    .tools{display:flex;gap:12px}
    .tools button{flex:1}
    .tools button.armed{background:#c0392b}
    #pad{display:none;position:fixed;inset:0;z-index:50;background:#000c;touch-action:none}
    #pad .hint{position:absolute;top:16px;left:0;right:0;text-align:center;color:#fff9;font-size:14px}
    #pad .dot{position:absolute;width:34px;height:34px;border-radius:50%;transform:translate(-50%,-50%);
      background:radial-gradient(circle,#ff2d2d 30%,#ff2d2d55 55%,transparent 70%);pointer-events:none;display:none}
    #pad .close{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:#fff2;border:1px solid #fff4}
  </style>
</head>
<body>
  <header>
    <span class="brand">Revela</span><span> · Mando</span>
    <span class="status" id="status">Sin conectar</span>
  </header>
  <main>
    <section class="screen active" id="connect">
      <h1>Conecta con la presentación</h1>
      <p>En el ordenador: <b>Ver ▸ Conectar móvil</b>. Escribe aquí el código:</p>
      <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE">
      <button id="go">Conectar</button>
      <div class="err" id="err"></div>
    </section>

    <section class="screen" id="control">
      <div class="meta"><span class="pos" id="pos">–/–</span><span class="title" id="title"></span>
        <span class="timer" id="timer">00:00</span></div>
      <div class="notes"><div class="lbl">Notas de esta diapositiva</div><div id="notes"></div>
        <div class="next"><span class="lbl">Siguiente</span> <span id="nextnotes"></span></div></div>
      <div class="nav">
        <button class="ghost" id="prev">◀ Anterior</button>
        <button id="next">Siguiente ▶</button>
      </div>
      <div class="tools">
        <button class="ghost" id="pointer">Puntero láser</button>
        <button class="ghost" id="black">Pantalla negra</button>
        <button class="ghost" id="reset-timer">⏱ Reiniciar</button>
      </div>
    </section>
  </main>

  <div id="pad"><div class="hint">Mueve el dedo para apuntar</div><div class="dot" id="dot"></div>
    <button class="close" id="padclose">Cerrar puntero</button></div>

  <script type="module" src="src/apps/remote/main.js"></script>
</body>
</html>
